<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Em</title>
    <style>
        /* Định dạng cơ bản cho toàn trang */
        body { background: #0f0f0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Arial', sans-serif; text-align: center; cursor: pointer; overflow: hidden;}
        
        /* Container chính chứa toàn bộ nội dung */
        .card { padding: 30px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; box-shadow: 0 0 30px rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.2); max-width: 85%; transition: all 0.5s ease; }

        /* Trái tim ở trạng thái BAN ĐẦU (đứng yên) */
        .heart { font-size: 80px; color: #ff4d4d; text-shadow: 0 0 15px #ff4d4d; margin-bottom: 10px; transition: transform 0.3s ease; }

        /* Chữ "Chạm vào" ban đầu */
        .tap-text { font-size: 1.2rem; color: #ff4d4d; font-weight: bold; animation: fadeBlink 1.5s infinite; }

        /* Lời nhắn, ngày tháng, chữ ký (ban đầu bị ẨN) */
        .main-content { display: none; opacity: 0; transition: opacity 1s ease; }

        /* -------- CÁC CLASS SẼ ĐƯỢC THÊM VÀO KHI CLICK -------- */

        /* Khi click: Trái tim bắt đầu đập */
        .heart.beating { animation: beat 0.8s infinite alternate; font-size: 70px; /* Nhỏ lại một chút để cân đối */}

        /* Khi click: Hiện nội dung chính */
        .main-content.show { display: block; opacity: 1; }

        /* Khi click: Ẩn chữ "Chạm vào" */
        .tap-text.hide { display: none; }

        /* Định dạng nội dung lời nhắn */
        h2 { color: #ff4d4d; font-size: 1.4rem; margin: 15px 0; }
        p { line-height: 1.6; font-size: 1rem; margin-bottom: 15px; color: #e0e0e0; }
        .date { font-size: 0.8rem; color: #888; margin-top: 20px; }
        .sign { margin-top: 15px; font-weight: bold; color: #ff4d4d; font-size: 1.1rem; }

        /* Keyframes cho hiệu ứng Trái tim đập */
        @keyframes beat { to { transform: scale(1.2); } }
        /* Keyframes cho chữ "Chạm vào" nhấp nháy */
        @keyframes fadeBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body onclick="revealContent()">

    <div class="card">
        <!-- Khu vực Trái tim & Chữ Chạm vào (luôn hiện lúc đầu) -->
        <div class="heart" id="heartIcon">❤️</div>
        <div class="tap-text" id="tapText">Chạm vào</div>

        <!-- Khu vực Lời nhắn (ban đầu bị ẩn) -->
        <div class="main-content" id="mainContent">
            <h2>Chúc mừng tuổi 22!</h2>
            <p>Chúc em tuổi 22 nhiều sức khỏe, hạnh phúc và luôn tươi cười. Những hành trình sẽ mang đến cho em sự tích cực.</p>
            <p>Cả hành trình của hai đứa mình nữa nhé :></p>
            <div class="date">05/07/2025</div>
            <div class="sign">"ngiu em"<br>Nguyễn Đức Trí</div>
        </div>
    </div>

    <script>
        // Hàm xử lý khi người dùng chạm vào bất kỳ đâu trên màn hình
        function revealContent() {
            // 1. Lấy các phần tử cần tương tác
            const heart = document.getElementById('heartIcon');
            const tapText = document.getElementById('tapText');
            const content = document.getElementById('mainContent');

            // 2. Thêm class "beating" để trái tim bắt đầu đập
            heart.classList.add('beating');

            // 3. Ẩn chữ "Chạm vào"
            tapText.classList.add('hide');

            // 4. Hiện lời nhắn
            content.classList.add('show');
            
            // 5. Ngăn không cho click lần nữa (không cần thiết nhưng tốt cho hiệu suất)
            document.body.onclick = null;
        }
    </script>
</body>
</html>
