<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
        }
        .heart {
            font-size: 80px;
            color: #ff4d4d;
            animation: beat 0.8s infinite alternate;
            text-shadow: 0 0 20px #ff4d4d;
            margin-bottom: 20px;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            color: #ff4d4d;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.6;
            font-size: 1.1rem;
            max-width: 300px;
            margin: 0 auto 15px auto;
        }
        .footer {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
        }
        .signature {
            margin-top: 20px;
            font-weight: bold;
            color: #ff4d4d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h2>Chúc mừng sinh nhật Gia Uyên tuổi 22!</h2>
        <p>Chúc em tuổi 22 nhiều sức khỏe, hạnh phúc và luôn tươi cười. Những hành trình sẽ mang đến cho em sự tích cực.</p>
        <p>Cả hành trình của hai đứa mình nữa nhé :></p>
        <div class="footer">05/07/2025</div>
        <div class="signature">"ngiu em"<br>Nguyễn Đức Trí</div>
    </div>
</body>
</html>
